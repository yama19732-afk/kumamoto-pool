name: Update pool information

on:
  schedule:
    - cron: "15 21 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official sites
        run: python update_data.py

      - name: Commit changes
        run: |
          git config user.name "pool-info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update pool information"
          git push
